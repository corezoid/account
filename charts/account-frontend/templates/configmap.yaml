{{- $global_data := .Values.global }}
{{- $account_data := $global_data.account }}
{{- $oneApp := default false .Values.global.account.config.one_app }}
{{- /* Avatar delivery settings (CGA-2527/2528/2529); all optional, defaults keep old behaviour + caching */ -}}
{{- $avatars := default (dict) $account_data.frontend.avatars }}
{{- $avatarsCache := default (dict) $avatars.cache }}
{{- $avatarsVersionedMaxAge := $avatarsCache.versioned_max_age | default 31536000 | int64 }}
{{- $avatarsUnversionedMaxAge := $avatarsCache.unversioned_max_age | default 86400 | int64 }}
{{- $avatarsPlaceholderMaxAge := $avatarsCache.placeholder_max_age | default 120 | int64 }}
{{- $avatarsPoster := default (dict) $avatars.poster }}
{{- $avatarsPosterEnabled := ternary true $avatarsPoster.enabled (not (hasKey $avatarsPoster "enabled")) }}
{{- $avatarsPosterPort := $avatarsPoster.port | default 8090 | int64 }}
{{- $avatarsPosterCacheMaxSize := $avatarsPoster.cache_max_size | default "200m" }}
{{- $avatarsPosterCacheValid := $avatarsPoster.cache_valid | default "30d" }}
{{- $avatarsPosterJpegQuality := $avatarsPoster.jpeg_quality | default 80 | int64 }}

{{- /* Single source of truth for the Account CSP. Call with (dict "root" $ "scope" "app"|"env"):
       "app" — SPA/API locations (common.csp.policy): *.<domain> + www.gstatic.com
       "env" — server block and /avatars/ locations: keeps the narrower *.<env>.<domain> */ -}}
{{- define "account.frontend.csp.value" -}}
{{- $v := .root.Values -}}
{{- $app := eq .scope "app" -}}
default-src 'self' blob: 'unsafe-inline' 'unsafe-eval' data: {{- range $v.global.account.content_security_policy.urls }} {{.}}{{- end }} https://unpkg.com wss://*.{{ $v.global.env }}.{{ $v.global.domain }} https://{{ $v.global.account.subDomain}}.{{ $v.global.domain }} https://*.control.events https://img.icons8.com/ https://www.google-analytics.com https://fonts.gstatic.com{{ if $app }} https://www.gstatic.com{{ end }} https://www.googletagmanager.com {{ if $app }}https://*.{{ $v.global.domain }}{{ else }}https://*.{{ $v.global.env }}.{{ $v.global.domain }}{{ end }} https://github.com https://www.facebook.com https://appleid.apple.com https://*.google.com https://stats.g.doubleclick.net https://fonts.googleapis.com https://*.google.com.ua https://*.shopify.com https://shopify.com https://*.googleusercontent.com https://*.simulator.company; frame-ancestors 'self' https://{{ $v.global.account.subDomain}}.{{ $v.global.domain }} https://*.control.events https://*.simulator.company {{- range $v.global.account.content_security_policy.urls }} {{.}}{{- end }}; object-src 'none'; base-uri 'self';
{{- end -}}

{{- define "common.security.headers" -}}
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        add_header X-Content-Type-Options nosniff;
        {{- if .Values.global.account.frontend.disable_sameorigin }}
        #add_header X-Frame-Options SAMEORIGIN;
        {{- else }}
        add_header X-Frame-Options SAMEORIGIN;
        {{- end }}
        add_header X-XSS-Protection "1; mode=block";
        add_header 'Referrer-Policy' 'origin-when-cross-origin';
        add_header Permissions-Policy "geolocation=(), camera=()";
{{- end -}}

{{- /* Headers repeated in every /avatars/ location (a location-level add_header replaces the server-level set) */ -}}
{{- define "account.frontend.avatars.headers" -}}
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
add_header X-Content-Type-Options nosniff;
{{- if .Values.global.account.frontend.disable_sameorigin }}
#add_header X-Frame-Options SAMEORIGIN;
{{- else }}
add_header X-Frame-Options SAMEORIGIN;
{{- end }}
add_header X-XSS-Protection "1; mode=block";
add_header 'Referrer-Policy' 'origin-when-cross-origin';
add_header Permissions-Policy "geolocation=(), camera=()";
{{- if .Values.global.simulator }}
{{- if .Values.global.account.access_control_allow_origin }}
add_header 'Access-Control-Allow-Origin' $cors_origin always;
{{- else }}
add_header 'Access-Control-Allow-Origin' 'https://{{ .Values.global.simulator.subDomain}}.{{ .Values.global.simulator.mainDomian }}';
{{- end }}
{{- end }}
add_header Content-Security-Policy "{{ include "account.frontend.csp.value" (dict "root" . "scope" "env") }}";
{{- end -}}

{{- define "common.csp.policy" -}}
        add_header Content-Security-Policy "{{ include "account.frontend.csp.value" (dict "root" . "scope" "app") }}";
{{- end -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "account.frontend.configmap.name.nginx" . }}
  labels:
    {{- include "account.frontend.labels" . | nindent 4 }}
data:
  nginx.conf: |
    user  nginx;
    worker_processes 1;
    error_log /dev/stdout;
    pid        /var/run/nginx.pid;

    load_module /etc/nginx/modules/ngx_http_image_filter_module.so;

    events {
      worker_connections  32000;
      multi_accept on;
    }

    http {
      client_max_body_size 25m;
      server_names_hash_bucket_size 128;
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
      log_format up_log escape=json '{'
                        '"server_addr": "$server_addr",'
                        '"server_port": "$server_port",'
                        '"http_x_forwarded_for": "$http_x_forwarded_for",'
                        '"time_iso8601": "$time_iso8601",'
                        '"upstream_addr": "$upstream_addr",'
                        '"request": "$request",'
                        '"path": "$uri",'
                        '"status": $status,'
                        '"body_bytes_sent": $body_bytes_sent,'
                        '"request_time": $request_time,'
                        '"upstream_response_time": "$upstream_response_time",'
                        '"http_referer": "$http_referer",'
                        '"http_user_agent": "$http_user_agent",'
                        '"host": "$host"'
                        '}';
      access_log /dev/stdout up_log;

      sendfile        on;
      tcp_nopush     on;

      {{- if .Values.global.simulator }}
      map $http_origin $cors_origin {
        default "";
        "https://{{ .Values.global.simulator.subDomain }}.{{ .Values.global.simulator.mainDomian }}" "https://{{ .Values.global.simulator.subDomain }}.{{ .Values.global.simulator.mainDomian }}";
        {{- if .Values.global.account.access_control_allow_origin }}
        {{- range .Values.global.account.access_control_allow_origin.urls }}
        "{{ . }}" "{{ . }}";
        {{- end }}
        {{- end }}
      }
      {{- end }}

      # Allowed origins for OAuth 2.0 XHR endpoints (/oauth2/*). Localhost
      # with any port is permitted for MCP Inspector / Claude Desktop and
      # similar tools running on the developer's machine. Production MCP
      # clients on real domains can be added via:
      #   global.account.oauth2.cors_origins: ["https://example.com", ...]
      # If the Origin does not match, the map returns "" and nginx drops
      # the Access-Control-Allow-Origin header entirely, so the browser
      # blocks the request.
      map $http_origin $oauth2_cors_origin {
        default "";
        "~^http://localhost(:[0-9]+)?$"     $http_origin;
        "~^http://127\.0\.0\.1(:[0-9]+)?$"  $http_origin;
        "~^http://\[::1\](:[0-9]+)?$"       $http_origin;
        {{- if .Values.global.account.oauth2 }}
        {{- range .Values.global.account.oauth2.cors_origins }}
        "{{ . }}" "{{ . }}";
        {{- end }}
        {{- end }}
      }

      # Avatar Cache-Control (CGA-2527): ?v=<N> URLs are versioned by the client -> immutable
      map $arg_v $avatars_cache_control {
        default  "public, max-age={{ $avatarsVersionedMaxAge }}, immutable";
        ""       "public, max-age={{ $avatarsUnversionedMaxAge }}";
      }
      {{- if $avatarsPosterEnabled }}
      # resized poster frames (CGA-2529): a fallback poster (user photo / anonymous) gets the short TTL
      map $upstream_http_x_avatar_source $avatars_poster_cache_control {
        default  "public, max-age={{ $avatarsPlaceholderMaxAge }}";
        ""       $avatars_cache_control;
      }
      proxy_cache_path /var/cache/nginx/avatars levels=1:2 keys_zone=avatars_posters:10m max_size={{ $avatarsPosterCacheMaxSize }} inactive={{ $avatarsPosterCacheValid }} use_temp_path=off;
      {{- end }}

      server_tokens   off;
      # disable buffering
      proxy_buffering off;
      proxy_max_temp_file_size 0;
      keepalive_timeout  65;
      gzip on;
      gzip_types text/css application/x-javascript text/xml application/xml application/xml+rss text/plain application/javascript text/javascript application/json image/png image/svg+xml;
      gzip_proxied any;

      include /etc/nginx/conf.d/*.conf;
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "account.frontend.configmap.name.site" . }}
  labels:
    {{- include "account.frontend.labels" . | nindent 4 }}
data:
  {{ .Values.appName }}.conf: |
    server {
      listen {{ include "account.frontend.portNumber" . }};
      server_name {{ .Values.global.account.subDomain }}.{{ .Values.global.domain }};

      access_log /dev/stdout up_log;
      error_log  /dev/stdout;

      root /ebsmnt/www/mw-auth;
      set $avatars_local    /{{ .Values.global.account.persistantVolumeClaimShareDir }};

      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
      add_header X-Content-Type-Options nosniff;
      {{- if .Values.global.account.frontend.disable_sameorigin }}
      #add_header X-Frame-Options SAMEORIGIN;
      {{- else }}
      add_header X-Frame-Options SAMEORIGIN;
      {{- end }}
      add_header X-XSS-Protection "1; mode=block";
      add_header 'Referrer-Policy' 'origin-when-cross-origin';
      add_header Permissions-Policy "geolocation=(), camera=()";
      add_header Content-Security-Policy "{{ include "account.frontend.csp.value" (dict "root" . "scope" "env") }}";

      # ------------------------------------------------------------------------
      # Avatars — served from the shared volume $avatars_local (CGA-2527/2528/2529)
      #
      #   URL                                        on miss
      #   /avatars/<id>.jpg                          placeholder avatar, 200
      #   /avatars/<WxH>/<file>                      placeholder avatar, 200 (resized on the fly)
      #   /avatars/workspaces/<ws>/<file>            placeholder avatar, 200
      #   /avatars/workspaces/<ws>/<WxH>/<file>      placeholder avatar, 200 (resized on the fly)
      #   /avatars/animation/<id>.jpg                user photo, else anonymous.jpg, 200
      #   /avatars/animation/<WxH>/<id>.jpg          same, resized + cached (see the resize server below)
      #   /avatars/animation/<id>.mp4                404 if the user has a photo but no animation
      #                                              (the <video> errors out and the poster stays),
      #                                              anonymous.mp4 if the user has no photo at all
      #   anything else under /avatars/              exact file or 404 (upload hashes, workspace logos,
      #                                              *_blue.jpg read back by the animation generator)
      #
      # Cache-Control: URLs with ?v=<N> are versioned by the Simulator (users.version is bumped by the
      # Account `user/set` event on every profile update) -> long immutable TTL; URLs without ?v= get
      # one day; placeholders, fallbacks and 404s get a short TTL so a freshly generated avatar shows
      # up quickly. All values: global.account.frontend.avatars.cache.*
      # ------------------------------------------------------------------------

      location @avatar_placeholder {
        try_files /static/avatar.jpg =404;
        add_header Cache-Control "public, max-age={{ $avatarsPlaceholderMaxAge }}";
        {{- include "account.frontend.avatars.headers" . | nindent 8 }}
      }

      location @anonymous_jpg {
        try_files /static/anonymous.jpg =404;
        add_header Cache-Control "public, max-age={{ $avatarsPlaceholderMaxAge }}";
        {{- include "account.frontend.avatars.headers" . | nindent 8 }}
      }

      location @anonymous_mp4 {
        # the user has a photo but no (or not yet generated) animation: 404, so the <video> element
        # errors out and the poster stays (used to return the JPEG body with a video URL)
        if (-f $avatars_local/animation/$uid.jpg) { return 404; }
        if (-f $avatars_local/$uid.jpg)           { return 404; }
        # no photo at all: generic animation
        try_files /static/anonymous.mp4 =404;
        add_header Cache-Control "public, max-age={{ $avatarsPlaceholderMaxAge }}" always;
        {{- include "account.frontend.avatars.headers" . | nindent 8 }}
      }

      location @avatar_not_found {
        add_header Cache-Control "public, max-age={{ $avatarsPlaceholderMaxAge }}" always;
        return 404;
      }

      # /avatars/workspaces/<ws>/<WxH>/<file> — resized workspace-scoped user avatar
      location ~ "^/avatars/workspaces/(?<ws_id>[^/]+)/(?<w>[1-9][0-9]{1,3})x(?<h>[1-9][0-9]{1,3})/(?<fname>[^/]+)$" {
        add_header      Content-Type image/jpeg;
        alias $avatars_local;
        try_files /workspaces/$ws_id/$fname /$fname @avatar_placeholder;

        image_filter                crop  $w  $h;
        image_filter_buffer 20M;
        image_filter_jpeg_quality 75; # Desired JPG quality

        add_header Cache-Control $avatars_cache_control;
        {{- include "account.frontend.avatars.headers" . | nindent 8 }}
      }

      # /avatars/workspaces/<ws>/<file> — workspace-scoped user avatar, original size
      location ~ ^/avatars/workspaces/(?<ws_id>[^/]+)/(?<fname>[^/]+)$ {
        add_header      Content-Type image/jpeg;
        alias $avatars_local;
        try_files /workspaces/$ws_id/$fname /$fname @avatar_placeholder;

        add_header Cache-Control $avatars_cache_control;
        {{- include "account.frontend.avatars.headers" . | nindent 8 }}
      }

      {{- if $avatarsPosterEnabled }}
      # /avatars/animation/<WxH>/<id>.jpg — poster frame resized to the rendered tile size (CGA-2529).
      # Resizing is done once by the internal resize server and cached on the local disk; ?v= is part
      # of the cache key so a bumped version is served without a purge. A fallback poster (user photo /
      # anonymous) is marked by the resize server with X-Avatar-Source and gets the short TTL.
      location ~ "^/avatars/animation/(?<w>[1-9][0-9]{1,3})x(?<h>[1-9][0-9]{1,3})/(?<uid>[0-9]+)\.jpg$" {
        proxy_pass http://127.0.0.1:{{ $avatarsPosterPort }}/animation/$w/$h/$uid.jpg;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_max_temp_file_size 10m;
        proxy_cache avatars_posters;
        proxy_cache_key "$w:$h:$uid:$arg_v";
        proxy_cache_valid 200 {{ $avatarsPosterCacheValid }};
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_intercept_errors on;
        error_page 404 415 500 502 504 = @avatar_not_found;

        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Avatar-Source $upstream_http_x_avatar_source;
        add_header Cache-Control $avatars_poster_cache_control;
        {{- include "account.frontend.avatars.headers" . | nindent 8 }}
      }
      {{- end }}

      # /avatars/animation/<id>.jpg — full-size poster frame of the animated avatar
      location ~ ^/avatars/animation/(?<uid>[0-9]+)\.jpg$ {
        add_header      Content-Type image/jpeg;
        alias $avatars_local;
        try_files /animation/$uid.jpg @avatar_poster_fallback;

        add_header Cache-Control $avatars_cache_control;
        {{- include "account.frontend.avatars.headers" . | nindent 8 }}
      }

      # no poster yet: fall back to the user's static photo (short TTL — the poster is being generated)
      location @avatar_poster_fallback {
        root /;
        try_files $avatars_local/$uid.jpg @anonymous_jpg;
        add_header      Content-Type image/jpeg;
        add_header Cache-Control "public, max-age={{ $avatarsPlaceholderMaxAge }}";
        {{- include "account.frontend.avatars.headers" . | nindent 8 }}
      }

      # /avatars/animation/<id>.mp4 — 7.5 s looping animated avatar
      location ~ ^/avatars/animation/(?<uid>[0-9]+)\.mp4$ {
        alias $avatars_local;
        try_files /animation/$uid.mp4 @anonymous_mp4;

        add_header Accept-Ranges bytes;
        max_ranges 0;

        add_header Cache-Control $avatars_cache_control;
        {{- include "account.frontend.avatars.headers" . | nindent 8 }}
      }

      # /avatars/<WxH>/<file> — resized avatar from the volume root
      location ~ "^/avatars/(?<w>[1-9][0-9]{1,3})x(?<h>[1-9][0-9]{1,3})/(?<fname>[^/]+)$" {
        add_header      Content-Type image/jpeg;
        error_page 404 415 = @avatar_placeholder;
        alias $avatars_local/$fname;
        log_not_found off;

        image_filter                crop  $w  $h;
        image_filter_buffer 20M;
        image_filter_jpeg_quality 75; # Desired JPG quality

        add_header Cache-Control $avatars_cache_control;
        {{- include "account.frontend.avatars.headers" . | nindent 8 }}
      }

      # /avatars/<id>.jpg — user photo, original size
      location ~ ^/avatars/(?<uid>[0-9]+)\.jpg$ {
        add_header      Content-Type image/jpeg;
        error_page 404 = @avatar_placeholder;
        alias $avatars_local/$uid.jpg;
        log_not_found off;

        add_header Cache-Control $avatars_cache_control;
        {{- include "account.frontend.avatars.headers" . | nindent 8 }}
      }

      # everything else under /avatars/: exact files only, no placeholder
      location /avatars {
        add_header      Content-Type image/jpeg;
        error_page 404 415 = @avatar_not_found;
        alias $avatars_local;
        log_not_found off;

        add_header Accept-Ranges bytes;
        max_ranges 0;

        {{- include "account.frontend.avatars.headers" . | nindent 8 }}
      }

      # RFC 8414 authorization-server metadata. Served as a static file from
      # the SPA root, so we override the global default_type (octet-stream)
      # with application/json — strict OAuth / MCP clients refuse to parse
      # the document otherwise.
      # CORS is open because the document is public and MCP/OAuth clients
      # fetch it from arbitrary origins (e.g. localhost MCP Inspector).
      location = /.well-known/oauth-authorization-server {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, mcp-protocol-version" always;
        add_header Access-Control-Max-Age "86400" always;
        if ($request_method = OPTIONS) {
          return 204;
        }
        {{ include "common.security.headers" . }}
        {{ include "common.csp.policy" . }}
        try_files $uri =404;
      }

      # openid-configuration is a separate spec and is not served by this
      # host; without an explicit location it falls through to `location /`
      # and clients receive the SPA's index.html as if it were JSON.
      location = /.well-known/openid-configuration {
        {{ include "common.security.headers" . }}
        {{ include "common.csp.policy" . }}
        return 404;
      }

      location / {
        {{ include "common.security.headers" . }}
        {{ include "common.csp.policy" . }}
        try_files $uri /index.html;
      }

      # OAuth 2.0 endpoints called as XHR from browser-based MCP / OAuth
      # clients (Inspector, Claude Desktop, etc.) — needs CORS. Allowed
      # origins are gated by the $oauth2_cors_origin map above (localhost
      # only by default; extend via global.account.oauth2.cors_origins).
      # Declared with `^~` so it wins over the regex location below
      # regardless of file order.
      {{- if .Values.global.account.config.one_app }}
      location ^~ /oauth2/ {
        add_header Access-Control-Allow-Origin $oauth2_cors_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, mcp-protocol-version" always;
        add_header Access-Control-Expose-Headers "WWW-Authenticate" always;
        add_header Access-Control-Max-Age "86400" always;
        if ($request_method = OPTIONS) {
          return 204;
        }
        proxy_pass http://{{ include "account.workspace.service.name" . }}:{{ .Values.global.account.workspace.port | default 80}};
        add_header Cache-Control "no-cache, must-revalidate";
        {{ include "common.security.headers" . }}
        {{ include "common.csp.policy" . }}
      }
      location ~ ^/(client|public|face|webhook|api|auth|oauth2|download|pmi_lms) {
        proxy_pass http://{{ include "account.workspace.service.name" . }}:{{ .Values.global.account.workspace.port | default 80}};
        add_header Cache-Control "no-cache, must-revalidate";
        {{ include "common.security.headers" . }}
        {{ include "common.csp.policy" . }}
      }
      {{- else }}
      location ^~ /oauth2/ {
        add_header Access-Control-Allow-Origin $oauth2_cors_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, mcp-protocol-version" always;
        add_header Access-Control-Expose-Headers "WWW-Authenticate" always;
        add_header Access-Control-Max-Age "86400" always;
        if ($request_method = OPTIONS) {
          return 204;
        }
        proxy_pass http://{{ include "account.auth.service.name" . }}:{{ .Values.global.account.auth.port | default 80}};
        add_header Cache-Control "no-cache, must-revalidate";
        {{ include "common.security.headers" . }}
        {{ include "common.csp.policy" . }}
      }
      location ~ ^/(api|auth|oauth2|download|pmi_lms) {
        proxy_pass http://{{ include "account.auth.service.name" . }}:{{ .Values.global.account.auth.port | default 80}};
        add_header Cache-Control "no-cache, must-revalidate";
        {{ include "common.security.headers" . }}
        {{ include "common.csp.policy" . }}
      }

      location ~ ^/(client|public|face|webhook) {
        proxy_pass http://{{ include "account.workspace.service.name" . }}:{{ .Values.global.account.workspace.port | default 80}};
        add_header Cache-Control "no-cache, must-revalidate";
      }
      {{- end }}
      
      location /liveness-proxy {
        proxy_pass http://{{ include "account.workspace.service.name" . }}:{{ .Values.global.account.workspace.port | default 80}}/liveness;
        add_header Cache-Control "no-cache, must-revalidate";
        {{ include "common.security.headers" . }}
        {{ include "common.csp.policy" . }}
      }
    }

    {{- if $avatarsPosterEnabled }}
    # Internal resize server for animated-avatar poster frames (CGA-2529). Only reachable from the
    # main server block above through proxy_cache, never from the outside. Cropping is the same
    # image_filter used for the workspace avatars; a fallback (user photo / anonymous) is flagged with
    # X-Avatar-Source and gets a short cache lifetime via X-Accel-Expires.
    server {
      listen 127.0.0.1:{{ $avatarsPosterPort }};
      server_name avatars-resize.local;
      access_log off;

      set $avatars_local    /{{ .Values.global.account.persistantVolumeClaimShareDir }};

      location ~ "^/animation/(?<w>[1-9][0-9]{1,3})/(?<h>[1-9][0-9]{1,3})/(?<uid>[0-9]+)\.jpg$" {
        alias $avatars_local;
        try_files /animation/$uid.jpg @poster_from_photo;

        image_filter                crop  $w  $h;
        image_filter_buffer 20M;
        image_filter_jpeg_quality {{ $avatarsPosterJpegQuality }};
      }

      location @poster_from_photo {
        root /;
        try_files $avatars_local/$uid.jpg @poster_anonymous;

        image_filter                crop  $w  $h;
        image_filter_buffer 20M;
        image_filter_jpeg_quality {{ $avatarsPosterJpegQuality }};
        add_header X-Avatar-Source photo;
        add_header X-Accel-Expires {{ $avatarsPlaceholderMaxAge }};
      }

      location @poster_anonymous {
        root /ebsmnt/www/mw-auth;
        try_files /static/anonymous.jpg =404;

        image_filter                crop  $w  $h;
        image_filter_buffer 20M;
        image_filter_jpeg_quality {{ $avatarsPosterJpegQuality }};
        add_header X-Avatar-Source anonymous;
        add_header X-Accel-Expires {{ $avatarsPlaceholderMaxAge }};
      }
    }
    {{- end }}
